name: Build jshERP-boot JAR (JDK8 Maven)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动运行

jobs:
  build:
    runs-on: ubuntu-latest
    # ========== 核心修改：指定工作目录为 jshERP-boot ==========
    defaults:
      run:
        working-directory: ./jshERP-boot

    steps:
      - name: Checkout full code
        uses: actions/checkout@v4

      # 配置 JDK8 + 阿里云 Maven 镜像
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          maven-settings: |
            <settings>
              <mirrors>
                <mirror>
                  <id>aliyun-central</id>
                  <name>阿里云中央仓库</name>
                  <url>https://maven.aliyun.com/repository/public</url>
                  <mirrorOf>central</mirrorOf>
                </mirror>
              </mirrors>
            </settings>

      # 赋予 mvnw 执行权限（Linux 环境必加，防止权限报错）
      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw

      # Maven 打包，跳过测试
      - name: Package with Maven
        run: ./mvnw clean package -DskipTests

      # 上传 JAR 产物（路径对应 jshERP-boot 下的 target）
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jshERP-boot-jar
          path: jshERP-boot/target/*.jar
