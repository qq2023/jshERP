name: Build jshERP-boot JAR (JDK8 Maven)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 支持手动运行

jobs:
  build:
    runs-on: ubuntu-latest
    # 所有命令默认进入 jshERP-boot 目录
    defaults:
      run:
        working-directory: ./jshERP-boot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 配置 JDK8 + 阿里云 Maven 镜像（解决依赖慢/超时）
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          maven-settings: |
            <settings>
              <mirrors>
                <mirror>
                  <id>aliyun-central</id>
                  <name>阿里云中央仓库</name>
                  <url>https://maven.aliyun.com/repository/public</url>
                  <mirrorOf>central</mirrorOf>
                </mirror>
              </mirrors>
            </settings>

      # 直接使用系统 mvn 打包（不再依赖 mvnw），跳过测试
      - name: Package with Maven
        run: mvn clean package -DskipTests

      # 上传打包好的 JAR
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jshERP-boot-jar
          path: jshERP-boot/target/*.jar
